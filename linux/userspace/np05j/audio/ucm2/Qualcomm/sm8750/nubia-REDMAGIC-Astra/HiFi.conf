# ลำโพงสเตอริโอคู่ในตัว (NXP TFA9874 + Primary MI2S) และไมโครโฟนคู่ในตัว
# (WCD9395 AMIC1 + AMIC3 ผ่าน SoundWire2 -> LPASS TX Macro TX_CODEC_DMA_TX_3)
# สำหรับ nubia REDMAGIC Astra (NP05J)

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Stereo Speakers"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		# เส้นทางแอนะล็อกบน WCD9395: ADC1=AMIC1 (ไมค์หลัก), ADC2=AMIC3 (ไมค์รอง)
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC2 MUX' CH2_AMIC3"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC1 Volume' 12"
		cset "name='ADC2 Volume' 12"

		# เส้นทางดิจิทัลบน LPASS TX Macro: DEC0<-SWR_MIC0(ADC1), DEC1<-SWR_MIC1(ADC2)
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX SMIC MUX1' SWR_MIC1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='DEC1 MODE' ADC_DEFAULT"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		# เกนดิจิทัลของ TX Macro: -84 + 96 = +12 dB (มี headroom กันเสียงแตก)
		cset "name='TX_DEC0 Volume' 96"
		cset "name='TX_DEC1 Volume' 96"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='TX_DEC0 Volume' 0"
		cset "name='TX_DEC1 Volume' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC2 MUX' CH2_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
