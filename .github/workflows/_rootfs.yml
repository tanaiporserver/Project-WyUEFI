name: NP05J distribution images

on:
  workflow_call:
    inputs:
      image_id:
        required: true
        type: string
      matrix:
        required: true
        type: string
      shared_target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: NP05J ${{ matrix.target }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      SUNUEFI_BUILD_TARGET: ${{ matrix.target }}
      SUNUEFI_OVERLAY_TARGET: ${{ startsWith(matrix.target, 'debian-') && 'debian-gnome' || matrix.target == 'arch-denial' && 'nyarch-gnome' || matrix.target }}
      SUNUEFI_BUILD_ENVIRONMENT_ID: ${{ inputs.image_id }}
      SUNUEFI_CACHE_WORKSPACE: /workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/build-input
        with:
          operation: download
          name: builder
      - name: Load the verified builder and fixed sources
        run: |
          python3 tools/build/ci_container.py load
          ./build.sh sources --group firmware
          ./build.sh sources --group devices
      - uses: ./.github/actions/build-input
        with:
          operation: download
          name: firmware
      - uses: ./.github/actions/build-input
        with:
          operation: download
          name: kernel
      - name: Download the base overlay packages for this distribution
        uses: ./.github/actions/build-input
        with:
          operation: download
          name: overlay-${{ env.SUNUEFI_OVERLAY_TARGET }}
      - name: Download the Denial overlay packages when building Denial
        if: endsWith(matrix.target, '-denial')
        uses: ./.github/actions/build-input
        with:
          operation: download
          name: overlay-${{ matrix.target }}
      - name: Assemble the NP05J rootfs, shared ESP and sparse images
        run: |
          set -o pipefail
          mkdir -p build/logs artifacts/downloads
          docker run --rm --privileged -v "$PWD:/workspace" -w /workspace \
            -e SUNUEFI_BUILD_ENVIRONMENT_ID -e SUNUEFI_CACHE_WORKSPACE -e SUNUEFI_TOOLCHAIN_ROOT=/usr \
            -e SUNUEFI_BUILD_TARGET -e SUNUEFI_OVERLAY_TARGET \
            sunuefi-builder bash -euc '
              git config --global --add safe.directory "*"
              python3 -m venv .venv
              .venv/bin/pip install -r requirements-build.txt
              . .venv/bin/activate
              python3 tools/build/shared_products.py verify --device np05j --kind firmware
              python3 tools/build/shared_products.py verify --device np05j --kind kernel
              overlay="artifacts/packages/overlays/$SUNUEFI_OVERLAY_TARGET"
              extra=()
              if [[ "$SUNUEFI_BUILD_TARGET" == *-denial ]]; then
                extra+=(--denial-dir "artifacts/packages/overlays/$SUNUEFI_BUILD_TARGET")
              fi
              case "$SUNUEFI_BUILD_TARGET" in
                steamos|nyarch-gnome|arch-denial) root_mib=16384 ;;
                debian-gnome|debian-kde|debian-denial) root_mib=8192 ;;
              esac
              ./build.sh np05j-distro build \
                --target "$SUNUEFI_BUILD_TARGET" \
                --kernel artifacts/kernels/np05j \
                --overlay-dir "$overlay" \
                --output-bundle artifacts/release-np05j \
                --output-sparse artifacts/fastboot-sparse-np05j \
                --root-size-mib "$root_mib" \
                --execute "${extra[@]}"
            ' 2>&1 | tee build/logs/ci-build.log
      - name: Prepare the NP05J product downloads
        run: |
          mkdir -p artifacts/downloads/esp artifacts/downloads/root
          cp artifacts/fastboot-sparse-np05j/esp.img artifacts/downloads/esp/esp-np05j.sparse.img
          cp artifacts/fastboot-sparse-np05j/root.ext4.img "artifacts/downloads/root/root-${SUNUEFI_BUILD_TARGET}-np05j.sparse.img"
      - name: Shared NP05J sparse ESP
        if: matrix.target == inputs.shared_target
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-NP05J-ESP
          path: artifacts/downloads/esp/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: NP05J distribution sparse root
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-NP05J-Root-${{ matrix.target }}
          path: artifacts/downloads/root/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Stage build logs and manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-logs-${{ matrix.target }}
          path: |
            build/logs/
            build/distros/*-np05j/build.log
            build/distros/*-np05j/manifest.json
            build/distros/*-np05j/FAILED.json
            build/distros/*-np05j/packages.tsv
            artifacts/packages/overlays/${{ env.SUNUEFI_OVERLAY_TARGET }}/manifest.json
            artifacts/packages/overlays/${{ env.SUNUEFI_BUILD_TARGET }}/manifest.json
            artifacts/kernels/np05j/manifest.json
            artifacts/release-np05j/manifest.json
            artifacts/fastboot-sparse-np05j/manifest.json
            artifacts/fastboot-sparse-np05j/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
