name: Build products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-products.yml'
      - '.github/workflows/_*.yml'
      - '.github/actions/**'
      - 'build.sh'
      - 'Makefile'
      - 'requirements-build.txt'
      - 'containers/**'
      - 'config/**'
      - 'sources.lock.json'
      - '.gitmodules'
      - 'patches/**'
      - 'uefi/**'
      - 'vendor/piano/**'
      - 'vendor/piano-linux/**'
      - 'vendor/firmware/**'
      - 'vendor/np05j/**'
      - 'vendor/np05j-firmware/**'
      - 'linux/**'
      - 'tools/**'
      - '!tools/check_host.py'
      - '!tools/build/check_patch_series.py'
      - 'upstream/**'
      - 'android/**'
      - 'docs/user/install-from-artifact.md'
  workflow_dispatch:
    inputs:
      target:
        description: NP05J product to build (REDMAGIC Astra)
        type: choice
        options: [all, uefi, linux, debian-gnome, debian-kde, debian-denial, nyarch-gnome, arch-denial, steamos]
        default: all

permissions:
  contents: read

concurrency:
  group: build-products-np05j-${{ github.ref }}
  queue: max

jobs:
  select:
    runs-on: ubuntu-26.04
    outputs:
      has_build: ${{ steps.targets.outputs.has_build }}
      has_rootfs: ${{ steps.targets.outputs.has_rootfs }}
      rootfs_matrix: ${{ steps.targets.outputs.rootfs_matrix }}
      overlay_matrix: ${{ steps.targets.outputs.overlay_matrix }}
      shared_target: ${{ steps.targets.outputs.shared_target }}
      shared_matrix: ${{ steps.targets.outputs.shared_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Check NP05J port, patch series and build rules
        run: |
          ./build.sh check --pattern test_check_patch_series.py \
            --pattern test_prepare_sources.py \
            --pattern test_shared_products.py --pattern test_ci_container.py \
            --pattern test_ci_build_targets.py --pattern test_np05j_port.py
      - id: targets
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: python3 tools/ci_build_targets.py

  environment:
    needs: select
    if: needs.select.outputs.has_build == 'true'
    runs-on: ubuntu-26.04-arm
    outputs:
      image_id: ${{ steps.image.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - id: cache-key
        run: python3 tools/build/ci_container.py key --github-output "$GITHUB_OUTPUT"
      - id: cached-image
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ steps.cache-key.outputs.key }}
      - id: image
        name: Build or verify the shared builder image
        run: python3 tools/build/ci_container.py prepare --github-output "$GITHUB_OUTPUT"
      - name: Save the verified builder image once
        if: steps.cached-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ steps.cache-key.outputs.key }}
      - name: Check NP05J and Denial packaging rules in the builder container
        run: |
          docker run --rm --network none -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/workspace:ro" -w /workspace sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              id -u sunuefi-build >/dev/null 2>&1 ||
                useradd --system --create-home sunuefi-build
              ./build.sh check --group python-all --no-skips \
                --pattern test_np05j_port.py --pattern test_shared_products.py \
                --pattern test_ci_build_targets.py --pattern test_denial_packages.py \
                --pattern test_denial_manifest.py
            '
      - name: Pass the verified builder image to this run
        uses: ./.github/actions/build-input
        with:
          operation: upload
          name: builder
          paths: |
            build/ci-builder/image.tar
            build/ci-builder/manifest.json

  shared:
    needs: [select, environment]
    if: needs.select.outputs.has_build == 'true'
    uses: ./.github/workflows/_shared.yml
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      shared_matrix: ${{ needs.select.outputs.shared_matrix }}
      build_denial: >-
        ${{ contains(fromJSON(needs.select.outputs.overlay_matrix).target, 'debian-denial') ||
            contains(fromJSON(needs.select.outputs.overlay_matrix).target, 'arch-denial') }}

  overlays:
    needs: [select, environment, shared]
    if: needs.select.outputs.has_rootfs == 'true'
    uses: ./.github/workflows/_overlays.yml
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      matrix: ${{ needs.select.outputs.overlay_matrix }}

  build:
    needs: [select, environment, shared, overlays]
    if: needs.select.outputs.has_rootfs == 'true' && needs.overlays.result == 'success'
    uses: ./.github/workflows/_rootfs.yml
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      matrix: ${{ needs.select.outputs.rootfs_matrix }}
      shared_target: ${{ needs.select.outputs.shared_target }}

  logs:
    needs: [select, environment, shared, overlays, build]
    if: always() && needs.select.outputs.has_build == 'true'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - id: build-logs
        name: Check which build tasks produced logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          logs=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("build-logs-")) | .id')
          if [[ -n "$logs" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish one logs.zip and remove intermediate log artifacts
        if: steps.build-logs.outputs.present == 'true'
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs
          pattern: build-logs-*
          separate-directories: true
          delete-merged: true
          retention-days: 7
          compression-level: 6
      - name: Remove this run's intermediate archives after success
        if: >-
          success() && !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("build-input-")) | .id')
          while IFS= read -r id; do
            if [[ -n "$id" ]]; then
              [[ "$id" =~ ^[0-9]+$ ]]
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            fi
          done <<< "$ids"
