# การตั้งค่า SimpleInit สำหรับ nubia NP05J (REDMAGIC Astra) — ภาษาอังกฤษทั้งหมดและธีม OLED มืด

language = "en_US.UTF-8"
gui.dark = true
gui.dpi = 420
gui.rotate = 0
gui.anim = true
gui.bootmenu.column = 2
gui.driver.pointer.use_first = false

# ไม่นับถอยหลังออกอัตโนมัติ เพื่อให้ผู้ใช้เลือกเมนูได้อย่างสะดวก
boot.title = "REDMAGIC Astra  |  SunUEFI"
boot.default = "linux"
boot.second = "simple-init"
boot.timeout = -1
boot.uefi_probe = true
boot.uefi_bootmenu = true

boot.configs.linux {
    mode = "exit"
    desc = "Boot Linux"
    icon = "@app-boot-linux"
    show = true
    enabled = true
    order = 10
}

boot.configs.boot-file {
    mode = "simple-init"
    desc = "Boot From File (.efi)"
    icon = "@app-bootmgr"
    show = true
    enabled = true
    order = 40
    extra.activity = "boot-file"
}

boot.configs.setup {
    mode = "exit"
    desc = "UEFI Firmware Setup"
    icon = "@app-config-manager"
    show = true
    enabled = true
    order = 50
}

boot.configs.shell {
    mode = "exit"
    desc = "UEFI Shell"
    icon = "@app-uefi-shell"
    show = true
    enabled = true
    order = 60
}

boot.configs.files {
    mode = "simple-init"
    desc = "File Manager"
    icon = "@app-file-manager"
    show = true
    enabled = true
    order = 70
    extra.activity = "file-manager"
}

boot.configs.simple-init {
    mode = "simple-init"
    desc = "Tools & Apps"
    show = true
    enabled = true
    order = 80
}

boot.configs.uefi-bootmenu {
    mode = "folder"
    desc = "UEFI Boot Entries"
    show = false
    enabled = true
    order = 90
}

boot.configs.continue {
    mode = "exit"
    desc = "Restart"
    show = true
    enabled = true
    order = 100
}

boot.configs.reboots {
    mode = "folder"
    desc = "Power & Reboot"
    show = true
    enabled = true
    order = 95
}

boot.configs.poweroff {
    mode = "poweroff"
    desc = "Power Off"
    parent = "reboots"
    show = true
    enabled = true
    order = 10
}
boot.configs.reboot {
    mode = "reboot"
    desc = "Restart Device"
    parent = "reboots"
    show = true
    enabled = true
    order = 20
}
boot.configs.recovery {
    mode = "reboot"
    desc = "Reboot to Recovery"
    parent = "reboots"
    show = true
    enabled = true
    order = 30
    extra.arg = "recovery"
}
boot.configs.bootloader {
    mode = "reboot"
    desc = "Reboot to Fastboot"
    parent = "reboots"
    show = true
    enabled = true
    order = 40
    extra.arg = "bootloader"
}
boot.configs.edl {
    mode = "reboot"
    desc = "Reboot to EDL (9008)"
    parent = "reboots"
    show = true
    enabled = true
    order = 50
    extra.arg = "edl"
}
